name: Русский — сообщить о проблеме
description: Вылет, зависание, низкий FPS или неработающая функция.
labels:
- bug
- needs-triage
body:
- type: markdown
  attributes:
    value: 'Опишите проблему и приложите логи за время её возникновения.

      [Как найти логи](https://github.com/mmnt1337/S2Internal-Reports/blob/main/README.ru.md#как-приложить-логи).

      '
- type: textarea
  id: problem
  attributes:
    label: Что случилось?
    description: Что вы сделали, что пошло не так и что должно было произойти?
    placeholder: Включил ESP и миникарту. Через несколько минут метки ESP перестали обновляться. Выключение и повторное
      включение ESP не помогло.
  validations:
    required: true
- type: input
  id: versions
  attributes:
    label: Версия мода
    description: Укажите версию, название скачанного архива или ссылку на скачивание.
    placeholder: Версия / название архива / ссылка
  validations:
    required: false
- type: textarea
  id: context
  attributes:
    label: Подробности
    description: Лаунчер или ReShade? Какие функции были включены? Как часто повторяется? Есть ли другие моды или
      оверлеи? При низком FPS укажите FPS до/после и видеокарту. Скриншоты прикрепите здесь.
    placeholder: Запускаю лаунчером. Были включены ESP и миникарта. Проблема возникает через несколько минут.
  validations:
    required: false
- type: upload
  id: attachments
  attributes:
    label: Логи
    description: Приложите s2internal.log; при вылете или зависании — также логи crash_metrics за это время. Если
      лаунчер не запускает мод, приложите launcher.log. Перетащите файлы сюда или нажмите для выбора. Можно приложить
      ZIP. Проверьте файлы на наличие личных данных.
  validations:
    required: true
    accept: .log,.txt,.zip
